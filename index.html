<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileShare.io - P2P Local Network File Sharing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007bff'><path d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z'/></svg>">
</head>
<body>
    <!-- Login / Welcome View -->
    <div id="loginView" class="view active-view">
        <div class="login-container">
            <div class="brand-badge">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                </svg>
            </div>
            <h1>FileShare.io</h1>
            <p class="subtitle">Direct peer-to-peer file transfer on your local network. No cloud storage, 100% private & fast.</p>
            
            <div class="form-group">
                <label for="userNameInput">Your Name</label>
                <input type="text" id="userNameInput" placeholder="e.g. Alice or MacBook" autocomplete="off" maxlength="25">
            </div>

            <div class="form-group">
                <label for="roomCodeInput">Room Code</label>
                <input type="text" id="roomCodeInput" placeholder="Enter 6-digit room code to join" autocomplete="off" maxlength="10">
            </div>

            <div class="button-group">
                <button id="createRoomBtn" class="btn btn-primary" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Create Room
                </button>
                <button id="joinRoomBtn" class="btn btn-secondary" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                    Join Room
                </button>
            </div>

            <p id="loginError" class="error-message"></p>

            <div class="network-notice">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
                <span>Works on GitHub Pages with direct WebRTC P2P</span>
            </div>
        </div>
    </div>

    <!-- Active App View -->
    <div id="appView" class="view">
        <div id="sidebar-overlay"></div>
        
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Room Details</h2>
            </div>
            
            <div class="room-card">
                <span class="room-label">ROOM CODE</span>
                <div class="room-code-row">
                    <span id="roomCodeDisplay" class="room-code">------</span>
                    <button id="copyCodeBtn" class="icon-btn-small" title="Copy Room Code">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
                <button id="copyLinkBtn" class="btn btn-outline" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                    Copy Invite Link
                </button>
            </div>

            <div id="qrCodeContainer">
                <span class="qr-label">Scan to join on phone:</span>
                <div id="roomQrCodeWrapper"></div>
            </div>

            <hr class="sidebar-divider">

            <div class="users-header">
                <h3>Peers (<span id="userCount">0</span>)</h3>
            </div>
            <ul id="userList"></ul>

            <div class="sidebar-footer">
                <button id="leaveRoomBtn" class="btn btn-danger" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Leave Room
                </button>
            </div>
        </aside>

        <!-- Main Chat & Transfer Area -->
        <main class="main-content">
            <header class="main-header">
                <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="header-info">
                    <h1 class="header-title">FileShare.io</h1>
                    <span id="connectionBadge" class="status-badge status-connected">P2P Connected</span>
                </div>
            </header>

            <!-- Drag & Drop Overlay -->
            <div id="dropZoneOverlay" class="drop-zone-overlay">
                <div class="drop-zone-content">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <p>Drop files here to share with room</p>
                </div>
            </div>

            <!-- Messages & File Transfers List -->
            <div id="messages" class="messages-container"></div>

            <!-- Input Bar -->
            <div class="input-area">
                <button id="addFileBtn" class="icon-button" title="Send Files" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
                <input type="file" id="fileInput" multiple style="display: none;">
                <textarea id="messageInput" placeholder="Type a message or drag & drop files here..." rows="1"></textarea>
                <button id="sendMessageBtn" class="icon-button send-btn" title="Send Message" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </main>
    </div>

    <!-- Toast Notification for Copies and Alerts -->
    <div id="toast" class="toast"></div>

    <!-- Client-side libraries (self-contained in repo) -->
    <script src="lib/qrcode.min.js"></script>
    <script src="lib/peerjs.min.js"></script>
    <!-- Application Logic -->
    <script src="index.js"></script>
</body>
</html>
